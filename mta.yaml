_schema-version: "3.3.0"
ID: mdg-services-nodejs
version: 1.0.0
description: CAP project with local views and shared CCU schema

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production

modules:
  - name: mdg-services-nodejs-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: mdg-services-nodejs-auth
      - name: mdg-services-nodejs-db
        properties:
          TARGET_CONTAINER: ~{hdi-service-name}
      - name: hdi_ccu-ddl-hana-db
        group: SERVICE_REPLACEMENTS
        properties:
          key: ccu-external-hdi-service
          service: "~{ccu-container-name}"
      - name: mdg-services-nodejs-destination
      - name: mdg-services-nodejs-connectivity
      - name: mdg-services-nodejs-logging
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      memory: 4096M
      disk-quota: 4096M
      buildpack: nodejs_buildpack

  - name: mdg-services-nodejs-db-deployer
    type: hdb
    path: gen/db
    parameters:
      app-name: mdg-services-nodejs-db
    requires:
      - name: mdg-services-nodejs-db
        properties:
          TARGET_CONTAINER: "~{hdi-service-name}"
      - name: hdi_ccu-ddl-hana-db
        group: SERVICE_REPLACEMENTS
        properties:
          key: ccu-external-hdi-service
          service: "~{ccu-container-name}"

  - name: mdg-services-nodejs-approuter
    type: approuter.nodejs
    path: approuter
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: mdg_srv
          url: ~{srv-url}
          forwardAuthToken: true
      - name: mdg-services-nodejs-auth
      - name: mdg-services-nodejs-destination
    parameters:
      memory: 512M
      disk-quota: 512M

  - name: mdg-services-nodejs-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: mdg-services-nodejs-auth
        parameters:
          service-key:
            name: mdg-services-nodejs-auth-key
      - name: mdg-services-nodejs-destination
        parameters:
          content-target: true
      - name: srv-api
    parameters:
      content:
        subaccount:
          existing_destinations_policy: update
          destinations:
            - Name: MDG_CAP_V2
              Description: MDG CAP OData V2 (token exchange)
              URL: ~{srv-api/srv-url}
              ServiceInstanceName: mdg-services-nodejs-auth
              ServiceKeyName: mdg-services-nodejs-auth-key
              Authentication: OAuth2UserTokenExchange
              WebIDEEnabled: "true"
              HTML5.DynamicDestination: "true"
              WebIDEUsage: "odata_gen,odata_xs"
              TrustAll: "true"
              HTML5.Timeout: "120000"

resources:
  - name: mdg-services-nodejs-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        xsappname: mdg-services-nodejs
        tenant-mode: dedicated
      service: xsuaa
      service-plan: application
      path: xs-security.json

  - name: mdg-services-nodejs-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: ${service-name}

  - name: hdi_ccu-ddl-hana-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: hdi_ccu-ddl-hana-db
    properties:
      ccu-container-name: ${service-name}

  - name: mdg-services-nodejs-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: mdg-services-nodejs-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite

  - name: mdg-services-nodejs-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
